<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.Log In Nav | PrestoPaws</title>
    <style>
        :root {
            --ink: #28313b;
            --muted: #697581;
            --cream: #fffaf1;
            --teal: #2c7772;
            --line: #eadfd2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            color: var(--ink);
            background: var(--cream);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(100%, 430px);
            padding: 2.5rem;
            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;
            text-align: center;
        }

        img {
            width: 70%;
            height: 70%;
            border-radius: 0;
            object-fit: cover;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: 2.5rem;
        }

        p {
            color: var(--muted);
            font-family: Arial, sans-serif;
        }

        form {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        label {
            color: var(--ink);
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
        }


        footer {
            margin-top: 1rem;
            color: var(--muted);
            font-size: 0.9rem;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 0.8rem;
            border: 0;
            border-radius: 5px;
            color: white;
            background: wheat;
            cursor: pointer;
            font: 700 1rem Arial, sans-serif;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            color: black;
            font-family: Arial, sans-serif;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <img src="logo.jpg" alt="PrestoPaws logo">
        <form action="#" method="post">
            <button><a href="../customerPrototype/loginPage.html">Log in as customer</a></button>
            <button><a href="../providerPrototype/loginPage.html">Log in as business</a>
                <button><a href="../customerPrototype/homePage.html">Back to shop</a>
        </form>
    </main>
    <footer>© 2026 PrestoPaws</footer>
</body>

</html>
