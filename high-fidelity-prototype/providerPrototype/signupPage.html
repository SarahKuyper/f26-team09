<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P.Sign up | PrestoPaws</title>
  <style>
    :root {
      --ink: #28313b;
      --muted: #697581;
      --cream: #fffaf1;
      --teal: #2c7772;
      --line: #eadfd2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      color: var(--ink);
      background: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 430px);
      padding: 2.5rem;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      text-align: center;
    }

    img {
      width: 70%;
      height: 70%;
      border-radius: 0;
      object-fit: cover;
    }

    h1 {
      margin: 1rem 0 0.5rem;
      font-size: 2.5rem;
    }

    p {
      color: var(--muted);
      font-family: Arial, sans-serif;
    }

    form {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
      text-align: left;
    }

    label {
      color: var(--ink);
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      font: inherit;
    }

    button {
      padding: 0.8rem;
      border: 0;
      border-radius: 5px;
      color: white;
      background: var(--teal);
      cursor: pointer;
      font: 700 1rem Arial, sans-serif;
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      color: var(--teal);
      font-family: Arial, sans-serif;
      font-weight: 700;
      text-decoration: none;
    }

    footer {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <main>
    <img src="logo.jpg" alt="PrestoPaws logo">
    <h1>Join the pack.</h1>
    <p>Create an business account.</p>
    <form action="#" method="post">
      <label for="Bsn-name">Name of Business
        <input id="Bsn-name" name="Bsn-name" type="text" autocomplete="name" required>
      </label>
      <label for="bsn-email">Business Email address
        <input id="bsn-email" name="bsn-email" type="email" autocomplete="email" required>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="new-password" required>
      </label>
      <label for="confirm-password">Confirm password
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required>
      </label>
      <button type="submit"><a href="../providerPrototype/homePage.html"></a>Create a business account</button>
    </form>
    <a href="../customerPrototype/homePage.html">Back to shop</a>
  </main>
  <footer>© 2026 PrestoPaws</footer>
</body>

</html>
